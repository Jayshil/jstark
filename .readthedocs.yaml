# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc          # nbsphinx converts the notebooks' Markdown cells with pandoc

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - fitting     # jstark.fitting imports juliet; needed for its API pages
