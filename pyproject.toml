[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=8.0.0",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "jstark"
description = "Tool to reduce, extract, and analyse JWST timeseries data"
requires-python = ">=3.11"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "licenses/LICENSE.rst" }
authors = [
  { name = "Jayshil A. Patel", email = "jaspa@dtu.dk" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "matplotlib",
    "bottleneck>=1.3",
    "tqdm",
    "jwst>=2.0",
]
dynamic = ["version"]

[project.optional-dependencies]
fitting = [
    "juliet",
    "photutils",
    "corner",
]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
]
[project.urls]
repository = "https://github.com/Jayshil/jstark"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["jstark*"]

[tool.setuptools_scm]
version_file = "jstark/version.py"

[tool.pytest.ini_options]
testpaths = [
  "jstark",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"
norecursedirs = ["jstark[\\/]_dev"]

[tool.coverage.run]
omit = [
 "jstark/__init*",
 "jstark/conftest.py",
 "jstark/*setup_package*",
 "jstark/tests/*",
 "jstark/*/tests/*",
 "jstark/extern/*",
 "jstark/version*",
 "*/jstark/__init*",
 "*/jstark/conftest.py",
 "*/jstark/*setup_package*",
 "*/jstark/tests/*",
 "*/jstark/*/tests/*",
 "*/jstark/extern/*",
 "*/jstark/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
