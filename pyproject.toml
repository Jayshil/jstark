[build-system]
requires = [
  "setuptools>=77.0",
  "setuptools_scm[toml]>=8.0.0",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "jwstark"
description = "Tool to reduce, extract, and analyse JWST timeseries data"
requires-python = ">=3.11"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "GPL-3.0-or-later"
license-files = ["licenses/LICENSE.rst", "licenses/TEMPLATE_LICENSE.rst"]
authors = [
  { name = "Jayshil A. Patel", email = "jaspa@dtu.dk" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=6.0",
    "matplotlib",
    "bottleneck>=1.3",
    "tqdm",
    "jwst>=2.0",
]
dynamic = ["version"]

[project.optional-dependencies]
fitting = [
    "juliet",
    "setuptools",     # batman (via juliet) imports distutils, removed in Python 3.12
    "photutils",
    "corner",
    "radvel",
]
# optional JAX samplers of jstark.fitting (versions tested: jax 0.12.1, jaxoplanet 0.2.0,
# blackjax 1.7.1, numpyro 0.22.0, tinygp 0.3.1); GPUs: also pip install "jax[cuda12]"
jax = [
    "jax>=0.12",
    "jaxoplanet>=0.2",
    "blackjax>=1.7",
    "numpyro>=0.22",
    "tinygp>=0.3",
]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov",
]
docs = [
    "sphinx>=7",
    "sphinx-automodapi",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "nbsphinx",
    "ipython",
]
[project.urls]
repository = "https://github.com/Jayshil/jstark"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["jstark*"]

[tool.setuptools_scm]
version_file = "jstark/version.py"

[tool.pytest.ini_options]
testpaths = [
  "jstark",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"
norecursedirs = ["jstark[\\/]_dev"]

[tool.coverage.run]
omit = [
 "jstark/__init*",
 "jstark/conftest.py",
 "jstark/*setup_package*",
 "jstark/tests/*",
 "jstark/*/tests/*",
 "jstark/extern/*",
 "jstark/version*",
 "*/jstark/__init*",
 "*/jstark/conftest.py",
 "*/jstark/*setup_package*",
 "*/jstark/tests/*",
 "*/jstark/*/tests/*",
 "*/jstark/extern/*",
 "*/jstark/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
